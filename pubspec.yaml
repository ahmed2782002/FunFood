name: funfoodapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^4.8.4
  firebase_core: ^2.27.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2
  flutter_screenutil: ^5.9.3
  pin_code_fields: ^8.0.0
  pedometer: ^4.0.1
  provider: ^6.1.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  video_player: ^2.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: assets/icnnnn.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/videos/mus/
    - assets/videos/loss/
    - assets/videos/mus/jumping_jacks.mp4
